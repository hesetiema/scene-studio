name: Pages

# Publishes the playground's public surface to GitHub Pages: the studio and the
# vent demo (`vite build --mode pages`). perf / minimal / embed / demos stay in
# the repo for CI and local use, but they are not what a stranger should land on
# -- see the comment above the input map in apps/playground/vite.config.ts.
#
# The vent demo needs a snapshot, and the live one is gitignored because it names
# a real project: the pages build swaps in `apps/playground/demo-data/`, which is
# generated by `scripts/make-demo-data.mjs` and committed. The guard below refuses
# to deploy if a real identifier survives that swap.
#
# One-time setup: repository Settings -> Pages -> Source = "GitHub Actions".
# The project page is served from https://<owner>.github.io/<repo>/, which is why
# the pages build carries `base: "/scene-studio/"`.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: "build (pages surface)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install (lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build the public surface
        run: pnpm --filter @scenio/playground build:pages
      # Fails loudly if the pages build ever starts emitting a page that should
      # not be public, or ships the live snapshot instead of `demo-data/`.
      # Cheaper than reasoning about it during review — and the identifier scan
      # below is the only thing that turns "we ran the script" into "the site is
      # actually clean".
      - name: Guard the surface (two pages, sanitized snapshot only)
        run: |
          set -euo pipefail
          cd apps/playground/dist
          pages=$(find . -maxdepth 1 -name '*.html' -printf '%f\n' | sort)
          echo "published html: ${pages//$'\n'/ }"
          if [ "$pages" != $'index.html\nvent-demo.html' ]; then
            echo "::error::unexpected published page set: ${pages//$'\n'/ }"
            exit 1
          fi
          for dir in data bim; do
            [ -d "$dir" ] || { echo "::error::pages artifact is missing $dir"; exit 1; }
          done
          [ ! -d demos ] || { echo "::error::pages build carried the local demos/ thumbnails"; exit 1; }
          grep -q '"sanitized":true' data/vent/vent-real-data.json || {
            echo "::error::the vent snapshot is not the sanitized one (meta.sanitized missing)"
            exit 1
          }
          # Real project ids, site names, hostnames. One hit means the sanitizer
          # was bypassed or bypassed partially — the FBX chunks carry ids too, so
          # the scan has to be binary-safe (-a).
          bad='Pj9522457558|Pj7480382824|Pj3201050003|Bd1717703084831780864|Bd1718511769581756416|南京|吾悦|金街|dev-gw|meos\.net|XC_MainBuilding'
          if hits=$(grep -ralE "$bad" data bim); then
            echo "::error::real identifiers survived sanitization: $hits"
            exit 1
          fi
          du -sh . data bim
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      # deploy-pages authenticates to the Pages service with an OIDC token.
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
