name: Publish

# Tag-driven release: pushing a tag equal to packages/scene-editor's version
# publishes to npm. There is no npm token in this repository -- npm trusts the
# workflow itself through OIDC (trusted publishing), which also gets us a
# provenance attestation for free. Prerelease versions (containing "-") target
# the `next` tag; stable versions target `latest`.
#
# One-time setup on npmjs.com, package settings -> Trusted Publisher ->
# GitHub Actions:
#   owner hesetiema | repository scene-studio | workflow publish.yml
#   environment (blank) | allowed actions: tick "npm publish"
# That last box matters: a trusted publisher created today defaults to
# `npm stage publish` only, so an unticked "npm publish" turns every release
# into a staging run that then waits for a human OTP -- exactly the step this
# workflow exists to remove.
#
# Requires npm >= 11.5.1 and node >= 22.14 (the workflow checks and upgrades
# npm) on a GitHub-hosted runner; self-hosted runners are not supported by
# trusted publishing yet.
on:
  push:
    tags: ["0.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # The only thing that lets npm believe this is the trusted workflow.
      # Scoped to this job so the rest of the release cannot mint an OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - name: Install (lockfile)
        run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        run: |
          PKG=$(node -p "require('./packages/scene-editor/package.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} != packages/scene-editor version ${PKG}"
            exit 1
          fi
          echo "releasing ${PKG} from ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}"
      - name: Release metadata
        run: pnpm test:release
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Release identity
        # Job logs need admin rights to read from outside; annotations do not.
        # These are the exact claims npm matches against the trusted publisher,
        # so a mismatch is diagnosable without anyone opening the Actions page.
        run: |
          echo "::notice::node $(node --version), runner npm $(npm --version)"
          echo "::notice::publishing with $(npx --yes npm@11 --version)"
          echo "::notice::repo=${GITHUB_REPOSITORY} workflow_ref=${GITHUB_WORKFLOW_REF} ref=${GITHUB_REF} ref_type=${GITHUB_REF_TYPE} runner=${RUNNER_ENVIRONMENT}"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::notice::OIDC request URL present (id-token: write granted)"
          else
            echo "::warning::ACTIONS_ID_TOKEN_REQUEST_URL is unset -- this job cannot mint an OIDC token"
          fi
      - name: Publish
        working-directory: packages/scene-editor
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-*) TAG="next" ;;
            *)   TAG="latest" ;;
          esac
          echo "publishing ${VERSION} -> ${TAG}"
          # Run npm through npx rather than a global upgrade: setup-node prepends
          # its own PATH, so `npm install -g npm@11` can appear to succeed while
          # `npm publish` still uses the older bundled binary -- which signs the
          # provenance and then fails the PUT with a misleading E404.
          set +e
          LOG=$(mktemp)
          npx --yes npm@11 publish --access public --tag "$TAG" --registry=https://registry.npmjs.org/ 2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$STATUS" -ne 0 ]; then
            # The annotation is the only channel readable without admin rights on
            # the job log, so the cause goes there; the tail goes to the summary.
            # `npm notice` prints the whole tarball manifest first; including it
            # in the pattern buries the one line that actually says what failed.
            ERRS=$(grep -E '^npm (error|ERR)' "$LOG" | head -8 | tr '\n' ' ' | cut -c1-900)
            echo "::error::npm publish failed (exit $STATUS): ${ERRS:-no npm error lines, see the job summary}"
            OTHER=$(grep -viE '^npm (notice|error|ERR)' "$LOG" | tail -6 | tr '\n' ' ' | cut -c1-500)
            if [ -n "$OTHER" ]; then echo "::error::other output: $OTHER"; fi
            if grep -q "Signed provenance statement" "$LOG"; then
              echo "::warning::OIDC worked (provenance was signed). npm deliberately answers 404 for an unauthorised write: the trusted publisher likely has only \"npm stage publish\" allowed, or its repo/workflow/environment fields do not match the claims in the Release identity step."
            else
              echo "::warning::No provenance line: the OIDC exchange did not happen. Check the publishing npm version and id-token: write permission."
            fi
            if grep -qE 'E404|E403|not authorized|permission' "$LOG"; then
              echo "::error::npm refused the workflow. Check the trusted publisher on npmjs.com: owner hesetiema, repo scene-studio, workflow publish.yml, and the \"npm publish\" allowed action ticked."
            fi
            if grep -qE 'ENEEDAUTH|need auth|not authenticated|E401' "$LOG"; then
              echo "::error::OIDC was not used. Confirm job permissions include id-token: write and that the trusted publisher exists; a granular token is NOT a substitute (tokens are stage-only)."
            fi
            {
              echo "### Publish failed (exit ${STATUS})"
              echo ""
              echo '```'
              tail -30 "$LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$STATUS"
          fi

          {
            echo "### Published \`@scenio/scene-editor@${VERSION}\` on \`${TAG}\`"
            echo ""
            echo "Authenticated by OIDC trusted publishing -- no npm token involved."
            echo ""
            echo '```'
            echo "npm view @scenio/scene-editor dist-tags"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
