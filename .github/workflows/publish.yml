name: Publish

# Tag-driven release: pushing a tag that equals packages/scene-editor's version
# stages the package on npm. Publishing is two-phase on purpose (2026-11): a
# granular token can only push to the staging area, and `npm stage approve`
# requires a human TOTP code — so this workflow stops after staging and writes
# the approve command to the job summary. Prerelease versions (containing "-")
# target the `next` tag; stable versions target `latest`. Requires the NPM_TOKEN
# repository secret.
on:
  push:
    tags: ["0.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - name: Install (lockfile)
        run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        run: |
          PKG=$(node -p "require('./packages/scene-editor/package.json').version")
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} != packages/scene-editor version ${PKG}"
            exit 1
          fi
      - name: Release metadata
        run: pnpm test:release
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Stage for publish (approve is a human step — it needs an OTP)
        working-directory: packages/scene-editor
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-*) TAG="next" ;;
            *)   TAG="latest" ;;
          esac

          # Carried into the failure annotation: the job log needs admin rights to
          # read from outside the org, the annotation does not.
          echo "node $(node --version), npm $(npm --version)"

          # A token pasted with a trailing newline reaches npm as an illegal HTTP
          # header value -- "*** is not a legal HTTP header value" -- which names
          # neither the secret nor the character. Normalise first, then say what is
          # wrong if it still does not look like a token.
          TOKEN=$(printf '%s' "${NODE_AUTH_TOKEN:-}" | tr -d '[:space:]')
          if [ -z "$TOKEN" ]; then
            echo "::error::secret NPM_TOKEN is empty"
            exit 1
          fi
          if ! printf '%s' "$TOKEN" | grep -qE '^[A-Za-z0-9_.-]+$'; then
            echo "::error::secret NPM_TOKEN cannot be an HTTP header value (length ${#TOKEN}); re-paste it verbatim, no quotes and no line breaks"
            exit 1
          fi
          echo "token accepted: ${#TOKEN} chars"
          npm config set //registry.npmjs.org/:_authToken "$TOKEN" --location=user

          # `npm stage` shipped in npm 11 and node 24 bundles it. Fail loudly here
          # rather than with "Unknown command" halfway through a release.
          if ! npm stage --help >/dev/null 2>&1; then
            echo "::error::npm $(npm --version) has no 'stage' subcommand (needs >= 11)"
            exit 1
          fi

          # Uploads the tarball to the staging area; nothing becomes public.
          set +e
          LOG=$(mktemp)
          npm stage publish --access public --tag "$TAG" 2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$STATUS" -ne 0 ]; then
            # One line for the annotation (survives read-only API access) and the
            # full tail for the job summary (what a human sees in the browser).
            echo "::error::npm stage publish failed (exit $STATUS): $(grep -m3 -E 'npm (error|ERR)' "$LOG" | tr '\n' ' ' | cut -c1-700)"
            {
              echo "### Stage failed (exit ${STATUS})"
              echo ""
              echo '```'
              tail -30 "$LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$STATUS"
          fi

          {
            echo "### Staged \`@scenio/scene-editor@${VERSION}\` for \`${TAG}\`"
            echo ""
            echo "Nothing is public yet. A granular token can stage but not publish,"
            echo "and \`approve\` requires a 2FA code that CI does not hold."
            echo ""
            echo "Approve from a machine with the authenticator:"
            echo ""
            echo '```'
            echo "npx npm@latest stage list                       # copy the stage id"
            echo "npx npm@latest stage approve <stage-id> --otp <code>"
            echo '```'
            echo ""
            echo "Then confirm with \`npm view @scenio/scene-editor dist-tags\`."
          } >> "$GITHUB_STEP_SUMMARY"
