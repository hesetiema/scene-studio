<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vent-demo · 通风感知模型（真实数据）</title>
    <style>
      :root {
        --bg: #d6dde5;
        --panel: #ffffff;
        --blue: #246fe5;
        --gray-900: #1b2129;
        --gray-600: #5f6b7a;
        --gray-400: #c4c9cf;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        color: var(--gray-900);
      }
      #stage {
        position: absolute;
        inset: 0;
        display: block;
      }
      /* 模型就绪前不展示任何白色面板：nav / legend / 抽屉 / 面包屑都是空壳。
         就绪后由 vent-demo.ts 给 body 加 .ready 统一放开。 */
      /* runtime 默认 view 带底部 GridHelper；loadDocument 之前先藏住 canvas，
         避免加载区闪一帧网格。document 里的 gridVisible:false 生效后再放开。 */
      body:not(.ready) #stage {
        opacity: 0;
      }
      body:not(.ready) #nav,
      body:not(.ready) #legend,
      body:not(.ready) #detail-drawer {
        display: none !important;
      }
      /* ---- 图元覆盖层（CSS2D） ---- */
      /* 层级：图元(5) < UI 面板(10) < 加载遮罩(20) < 聚合列表(25) < 详情抽屉(30)。
         GraphScene 会把 #labels 追加到 body 末尾，没有 z-index 时它会
         盖住写在前面的 #legend —— 图例上的空间文字就是这么冒出来的。 */
      #labels {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 5;
      }
      #nav,
      #legend {
        z-index: 10;
      }
      .lbl {
        position: absolute;
        transform: translate(-50%, -50%);
        white-space: nowrap;
        user-select: none;
      }
      /* 设备图标 24×24 */
      .lbl-equip {
        width: 24px;
        height: 24px;
        pointer-events: auto;
        cursor: pointer;
      }
      .lbl-equip .ic {
        width: 24px;
        height: 24px;
        border-radius: 7px;
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: 0 2px 6px rgba(27, 33, 41, 0.18);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.12s ease, box-shadow 0.12s ease;
      }
      /* 图标自身带 fill/stroke 颜色（fan 实心 / window 描边），CSS 不覆盖 */
      .lbl-equip .ic svg {
        width: 18px;
        height: 18px;
      }
      /* 真实页设备标签默认只显示 24px 图标，名称 hover 才浮出 */
      .lbl-equip .name {
        display: none;
        position: absolute;
        left: 50%;
        top: 100%;
        transform: translateX(-50%);
        margin-top: 2px;
        font-size: 12px;
        line-height: 17px;
        padding: 1px 4px;
        border-radius: 4px;
        color: #1b2129;
        text-shadow:
          1px 0 0 #fff,
          0 1px 0 #fff,
          -1px 0 0 #fff,
          0 -1px 0 #fff;
      }
      .lbl-equip:hover .name {
        /* JS 会按碰撞结果给 .name 挂 .hidden（带 !important），这里要压过去 */
        display: block !important;
      }
      .lbl-equip:hover .ic {
        transform: translateY(-1px);
        box-shadow: 0 4px 10px rgba(27, 33, 41, 0.24);
        outline: 2px solid rgba(36, 111, 229, 0.45);
        outline-offset: 1px;
      }
      .lbl-equip .dots {
        position: absolute;
        /* 红点圆心压在图标右上角内侧约 3px，别浮在图标外面 */
        top: 0;
        right: -2px;
        display: flex;
        gap: 2px;
      }
      .lbl-equip .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        border: 2px solid #fff;
      }
      /* 聚合计数角标：单设备红点收起，组内告警改在角标右上角提示 */
      .lbl-grp {
        position: relative;
        width: 24px;
        height: 24px;
        border-radius: 7px;
        border: 1px solid #c4c9cf;
        background: #e8ecf0;
        box-shadow: 0 2px 6px rgba(27, 33, 41, 0.16);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 700;
        color: #3c4652;
        pointer-events: auto;
        cursor: pointer;
      }
      .lbl-grp .grp-dot {
        position: absolute;
        top: 0;
        right: -2px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        border: 2px solid #fff;
      }
      /* 空间标注 */
      .lbl-space {
        transform: translate(-50%, -100%);
        pointer-events: none;
        text-align: center;
      }
      .lbl-space .lux {
        font-size: 12px;
        line-height: 17px;
        color: #1b2129;
        text-shadow:
          1px 0 0 #fff,
          0 1px 0 #fff,
          -1px 0 0 #fff,
          0 -1px 0 #fff;
      }
      .lbl-space .name {
        font-size: 12px;
        line-height: 17px;
        color: #1b2129;
        text-shadow:
          1px 0 0 #fff,
          0 1px 0 #fff,
          -1px 0 0 #fff,
          0 -1px 0 #fff;
      }
      .hidden {
        display: none !important;
      }
      /* 选中态：设备图标加蓝环，空间名称加蓝底 */
      .lbl-equip.selected .ic {
        outline: 2px solid #246fe5;
        outline-offset: 2px;
        box-shadow: 0 0 0 4px rgba(36, 111, 229, 0.18);
      }
      .lbl-space {
        pointer-events: auto;
        cursor: pointer;
      }
      .lbl-space.selected .name,
      .lbl-space.selected .lux {
        color: #246fe5;
        font-weight: 700;
      }
      /* ---- 楼层切换遮罩：切层期间锁住画面，避免空白帧闪一下 ---- */
      #floor-loading {
        position: absolute;
        inset: 0;
        z-index: 20;
        pointer-events: none;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(214, 221, 229, 0.35);
        backdrop-filter: blur(1px);
      }
      #floor-loading.show {
        display: flex;
      }
      #floor-loading .box {
        display: flex;
        align-items: center;
        gap: 10px;
        background: #fff;
        border-radius: 8px;
        padding: 10px 18px;
        font-size: 13px;
        color: var(--gray-600);
        box-shadow: 0 4px 20px rgba(27, 33, 41, 0.12);
      }
      #floor-loading .spinner {
        width: 14px;
        height: 14px;
        border: 2px solid #c4c9cf;
        border-top-color: var(--blue);
        border-radius: 50%;
        animation: vent-spin 0.8s linear infinite;
      }
      @keyframes vent-spin {
        to {
          transform: rotate(360deg);
        }
      }
      /* ---- 聚合设备列表：点计数角标展开，行内点选仍走原详情抽屉 ---- */
      #group-popover {
        position: absolute;
        z-index: 25;
        min-width: 232px;
        max-width: 320px;
        padding: 10px 12px;
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 8px 28px rgba(27, 33, 41, 0.16);
        font-size: 12px;
        color: var(--gray-900);
      }
      #group-popover .gp-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        line-height: 18px;
        margin-bottom: 6px;
      }
      #group-popover .gp-hint {
        font-size: 11px;
        font-weight: 400;
        color: var(--gray-400);
      }
      #group-popover .gp-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 5px 4px;
        border-top: 1px solid #eef2f6;
        cursor: pointer;
      }
      #group-popover .gp-row:hover {
        background: #f5f8fc;
      }
      #group-popover .gp-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #group-popover .gp-state {
        flex-shrink: 0;
        color: var(--gray-600);
      }
      #group-popover .gp-alarm {
        flex-shrink: 0;
        padding: 0 5px;
        border-radius: 8px;
        background: #f55047;
        color: #fff;
        font-size: 11px;
        line-height: 16px;
      }
      /* ---- 选中详情抽屉 ---- */
      #detail-drawer {
        position: absolute;
        top: 12px;
        right: 12px;
        bottom: 12px;
        width: 340px;
        max-width: calc(100vw - 120px);
        z-index: 30;
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border-radius: 10px;
        box-shadow: 0 6px 28px rgba(27, 33, 41, 0.16);
        pointer-events: auto;
        transform: translateX(calc(100% + 24px));
        opacity: 0;
        transition:
          transform 0.22s ease,
          opacity 0.22s ease;
      }
      #detail-drawer.open {
        transform: translateX(0);
        opacity: 1;
      }
      #detail-drawer .drawer-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 18px 12px;
        border-bottom: 1px solid #e8ecf0;
        flex-shrink: 0;
      }
      #detail-drawer .drawer-kicker {
        font-size: 11px;
        line-height: 16px;
        color: var(--gray-600);
        letter-spacing: 0.5px;
      }
      #detail-drawer .drawer-title {
        font-size: 16px;
        line-height: 24px;
        font-weight: 700;
        color: var(--gray-900);
        word-break: break-all;
      }
      #detail-drawer .drawer-close {
        flex-shrink: 0;
        width: 26px;
        height: 26px;
        border: 0;
        border-radius: 6px;
        background: #f2f5f8;
        color: var(--gray-600);
        font-size: 18px;
        line-height: 26px;
        text-align: center;
        cursor: pointer;
      }
      #detail-drawer .drawer-close:hover {
        background: #e8ecf0;
        color: var(--gray-900);
      }
      #detail-drawer .drawer-body {
        flex: 1;
        overflow-y: auto;
        padding: 14px 18px 20px;
        font-size: 13px;
        line-height: 20px;
      }
      #detail-drawer .d-group {
        margin-bottom: 18px;
      }
      #detail-drawer .d-group h4 {
        font-size: 12px;
        font-weight: 700;
        color: var(--gray-600);
        margin: 0 0 8px;
      }
      #detail-drawer .d-row {
        display: flex;
        gap: 12px;
        padding: 5px 0;
        border-bottom: 1px dashed #eef1f4;
      }
      #detail-drawer .d-k {
        flex: 0 0 82px;
        color: var(--gray-600);
      }
      #detail-drawer .d-v {
        flex: 1;
        color: var(--gray-900);
        word-break: break-all;
      }
      #detail-drawer .d-pill {
        display: inline-block;
        padding: 0 8px;
        border-radius: 10px;
        font-size: 12px;
        line-height: 20px;
        color: #fff;
      }
      #detail-drawer .d-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      #detail-drawer .d-list li {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 5px 0;
        border-bottom: 1px dashed #eef1f4;
      }
      #detail-drawer .d-list em {
        font-style: normal;
        flex-shrink: 0;
        color: var(--gray-600);
      }
      #detail-drawer .d-empty {
        color: var(--gray-400);
      }
      /* 关联设备里的告警小红点，与设备图标右上角、图例「异常」同色 */
      #detail-drawer .d-alarm {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        vertical-align: middle;
        margin-left: 4px;
      }
      /* ---- 左侧楼层选择器（精简） ---- */
      #nav {
        position: absolute;
        left: 12px;
        top: 64px;
        /* 内容只有「全部建筑 + 少量楼层」时贴着内容收起，不留一整条空白面板 */
        max-height: calc(100% - 136px);
        width: 74px;
        background: var(--panel);
        border-radius: 8px;
        padding: 8px 6px;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 2px;
        overflow-y: auto;
        box-shadow: 0 2px 10px rgba(27, 33, 41, 0.08);
      }
      #nav button {
        border: 0;
        background: transparent;
        border-radius: 4px;
        padding: 6px 2px;
        font-size: 13px;
        line-height: 18px;
        color: var(--gray-900);
        cursor: pointer;
        text-align: center;
        flex-shrink: 0;
      }
      #nav button:hover {
        background: rgba(196, 201, 207, 0.3);
      }
      /* 「全部建筑」常驻入口：浅蓝底强调层级，选中态下方 .active 才是实心蓝 */
      #nav button.primary {
        background: rgba(36, 111, 229, 0.08);
        color: var(--blue);
        font-weight: 600;
      }
      #nav button.active {
        background: var(--blue);
        color: #fff;
        font-weight: 600;
      }
      #nav .nav-building {
        font-size: 13px;
        font-weight: 700;
        color: var(--gray-900);
        padding: 8px 2px 4px;
        text-align: center;
        flex-shrink: 0;
      }
      #nav .nav-sep {
        height: 1px;
        background: #e8ecf0;
        margin: 4px 2px;
        flex-shrink: 0;
      }
      /* 底部图例 */
      #legend {
        position: absolute;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        background: var(--panel);
        border-radius: 8px;
        padding: 8px 18px;
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 12px;
        color: var(--gray-600);
        box-shadow: 0 2px 10px rgba(27, 33, 41, 0.08);
        white-space: nowrap;
      }
      #legend .lg-title {
        font-weight: 700;
        color: var(--gray-900);
      }
      #legend .lg-item {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      #legend .sw {
        width: 12px;
        height: 12px;
        border-radius: 3px;
        display: inline-block;
      }
      #legend .sw.round {
        border-radius: 50%;
        width: 8px;
        height: 8px;
      }
      #legend .divider {
        width: 1px;
        height: 16px;
        background: #e8ecf0;
      }
      /* 状态行（默认隐藏：纯模型视图不显示调试文本） */
      #status {
        display: none;
      }
      /* 数据缺失提示卡（快照不入库） */
      .prepare {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(560px, calc(100% - 48px));
        background: #fff;
        border-radius: 10px;
        padding: 20px 24px;
        box-shadow: 0 8px 32px rgba(27, 33, 41, 0.12);
        pointer-events: auto;
        font-size: 13px;
        line-height: 20px;
        color: var(--gray-900);
      }
      .prepare h2 {
        font-size: 16px;
        line-height: 24px;
        margin-bottom: 8px;
      }
      .prepare p {
        margin: 8px 0;
      }
      .prepare ul {
        margin: 8px 0 8px 18px;
        color: var(--gray-600);
      }
      .prepare code {
        background: #f2f5f8;
        border-radius: 3px;
        padding: 1px 4px;
        font-size: 12px;
      }
      .prepare .err {
        color: #b4453c;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <scene-editor
      id="stage"
      scene-id="scene-vent-model"
      mode="viewer"
      instancing="false"
      min-camera-orbit="auto 0deg auto"
      max-camera-orbit="auto 80deg auto"
    ></scene-editor>
    <div id="labels"></div>
    <aside id="nav"></aside>
    <div id="legend"></div>
    <div id="status"></div>
    <div id="floor-loading"><div class="box"><span class="spinner"></span><span>楼层模型加载中…</span></div></div>
    <div id="group-popover" class="hidden" aria-hidden="true">
      <div class="gp-head"><span id="gp-title">聚合设备</span><span class="gp-hint">点行查看详情</span></div>
      <div id="gp-list"></div>
    </div>
    <aside id="detail-drawer" aria-hidden="true">
      <div class="drawer-head">
        <div>
          <div class="drawer-kicker" id="drawer-kicker">对象详情</div>
          <div class="drawer-title" id="drawer-title">—</div>
        </div>
        <button id="drawer-close" class="drawer-close" title="关闭详情">×</button>
      </div>
      <div class="drawer-body" id="drawer-body"></div>
    </aside>
    <script type="module" src="/src/vent/main.ts"></script>
  </body>
</html>
