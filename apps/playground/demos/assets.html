<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>资产加载 · scene-editor demo</title>
    <link rel="stylesheet" href="/src/styles/demo.css" />
  </head>
  <body>
    <header class="demo-bar">
      <a class="demo-back" href="/demos/">← 全部 demo</a>
      <strong>资产加载</strong>
      <span class="demo-hint">assetResolver · GLB 实例化 · AssetCache 引用计数</span>
      <span class="demo-pill" id="formats">formats</span>
    </header>

    <main class="demo-layout">
      <section class="demo-viewport" id="stage"></section>

      <aside class="demo-side">
        <div class="demo-group">
          <h3>assetResolver（宿主给 URL）</h3>
          <div class="demo-row">
            <button class="demo-btn primary" id="load-tri">加载 /assets/tri.glb</button>
            <button class="demo-btn danger" id="load-missing">加载缺失资产</button>
            <button class="demo-btn danger" id="load-unsupported">加载 .obj（不支持格式）</button>
          </div>
          <p class="demo-note">
            <code>el.assetResolver</code> 必须在 connect 之前设置；SDK 只按 id 解析 URL，不猜约定。
          </p>
        </div>

        <div class="demo-group">
          <h3>AssetCache 引用计数（无 GPU）</h3>
          <div class="demo-row">
            <button class="demo-btn" id="run-cache">retain ×2 → release ×2 → retain</button>
          </div>
          <p class="demo-note">
            并行 retain 合并成一次加载；引用归零才 dispose；再次 retain 重新加载。
          </p>
        </div>

        <div class="demo-group">
          <h3>结果</h3>
          <pre class="demo-code" id="output">—</pre>
        </div>

        <div class="demo-group">
          <h3>日志</h3>
          <div class="demo-log" id="log"></div>
        </div>
      </aside>
    </main>

    <div class="demo-status" id="status">初始化中…</div>

    <script type="module" src="/src/demos/assets.ts"></script>
  </body>
</html>
