<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文档模型 · scene-editor demo</title>
    <link rel="stylesheet" href="/src/styles/demo.css" />
  </head>
  <body>
    <header class="demo-bar">
      <a class="demo-back" href="/demos/">← 全部 demo</a>
      <strong>文档模型</strong>
      <span class="demo-hint">迁移 · 校验 · 层级 · 导入</span>
      <span class="demo-pill" id="schema-version">schema</span>
    </header>

    <main class="demo-layout">
      <section class="demo-viewport">
        <scene-editor id="viewport"></scene-editor>
        <div class="demo-status" id="status">初始化中…</div>
      </section>

      <aside class="demo-side wide">
        <div class="demo-group">
          <h3>输入（可直接编辑）</h3>
          <textarea class="demo-input" id="source" spellcheck="false"></textarea>
        </div>

        <div class="demo-group">
          <h3>操作</h3>
          <div class="demo-row">
            <button class="demo-btn primary" id="run-migrate">迁移 + 解析</button>
            <button class="demo-btn" id="run-validate">校验层级</button>
            <button class="demo-btn" id="run-import">导入编辑器</button>
          </div>
          <div class="demo-row">
            <button class="demo-btn danger" id="run-bad-hierarchy">坏层级</button>
            <button class="demo-btn danger" id="run-bad-color">坏字段</button>
            <button class="demo-btn danger" id="run-bad-version">未知版本</button>
          </div>
        </div>

        <div class="demo-group">
          <h3>结果</h3>
          <pre class="demo-code" id="output">—</pre>
        </div>

        <div class="demo-group">
          <h3>日志</h3>
          <div class="demo-log" id="log"></div>
        </div>
      </aside>
    </main>

    <script type="module" src="/src/demos/document.ts"></script>
  </body>
</html>
